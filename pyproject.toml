[project]
name = "zadenxx-account-manager"
version = "2.4.1"
description = "Monochrome, owner-only account manager built with Flet (desktop / mobile / web)."
requires-python = ">=3.9"
dependencies = ["flet>=0.21"]

[tool.flet.web]
# Defaults; the workflow overrides base_url per repository at build time.
# "hash" routing = works on static hosts without SPA rewrites (GitHub Pages).
base_url = "/"
route_url_strategy = "hash"
