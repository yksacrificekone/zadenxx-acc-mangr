name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  # Job 1 — compile the Python app into a static web bundle (WASM/JS)
  build:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Flet / Flutter SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/flet
            ~/.cache/flet
          key: flet-${{ runner.os }}

      - name: Install Flet
        run: python -m pip install --upgrade flet

      - name: Build web app
        shell: bash
        env:
          # Project sites (user/repo) are served under /repo-name/.
          # User sites (user.github.io) are served from the root.
          BASE_URL: ${{ github.event.repository.name == github.repository_owner && '/' || format('/{0}', github.event.repository.name) }}
        run: |
          flet build web \
            --base-url "${BASE_URL}" \
            --route-url-strategy hash \
            --yes --verbose

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: build/web
          name: web-build-artifact
          retention-days: 20

  # Job 2 — publish the compiled site to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
        with:
          artifact_name: web-build-artifact
